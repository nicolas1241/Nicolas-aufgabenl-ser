<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aufgabenlöser</title>
  <style>
    :root { --blue:#315ee8; --bg:#f5f7fb; --text:#172033; }
    * { box-sizing: border-box; }
    body { max-width:760px; margin:48px auto; padding:0 20px; font:16px/1.6 system-ui,sans-serif; color:var(--text); background:var(--bg); }
    main { padding:28px; border-radius:16px; background:white; box-shadow:0 8px 30px #17203312; }
    h1 { margin-top:0; }
    input,button { font:inherit; }
    input { display:block; margin:18px 0; width:100%; }
    button { padding:10px 18px; border:0; border-radius:8px; color:white; background:var(--blue); cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #preview { display:none; max-width:100%; max-height:360px; margin:18px 0; border-radius:8px; }
    #result { margin-top:24px; padding:16px; border-radius:8px; background:#f2f5fc; white-space:pre-wrap; }
    .hint { color:#596579; font-size:.92rem; }
  </style>
</head>
<body>
  <main>
    <h1>Aufgabenlöser</h1>
    <p>Lade ein Bild deiner Aufgabe hoch.</p>

    <form id="upload-form">
      <label for="image">Aufgabenbild (JPG, PNG oder WebP)</label>
      <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
      <img id="preview" alt="Vorschau des Aufgabenbildes">
      <button id="submit-button" type="submit">Bild hochladen</button>
    </form>

    <p class="hint">Hinweis: Diese statische GitHub-Pages-Version kann Bilder nicht direkt von einem KI-Server lösen. Für die automatische Lösung wird ein Backend oder ein geeigneter API-Dienst benötigt.</p>
    <div id="result" hidden aria-live="polite"></div>
  </main>

  <script>
    const form = document.querySelector("#upload-form");
    const input = document.querySelector("#image");
    const preview = document.querySelector("#preview");
    const result = document.querySelector("#result");

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    form.addEventListener("submit", (event) => {
      event.preventEvent?.();
    });
  </script>
</body>
</html>
